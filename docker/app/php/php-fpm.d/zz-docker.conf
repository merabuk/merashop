[www]
listen = 9000
user = {{ user_name }}
group = {{ group_name }}

listen.owner = www-data
listen.group = www-data

pm = static
pm.max_children = {{ static_php_fpm_pool_workers }}
; pm.min_spare_servers = 20 # Does not work with static pool
; pm.max_spare_servers = 20 # Does not work with static pool
pm.max_requests = 2000
request_terminate_timeout = 300s

pm.status_path = /status
ping.path = /ping
access.log = /dev/null
