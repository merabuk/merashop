server {
  listen 80;
  listen 443 ssl;
  http2  on;

  server_name {{ web_domain }} {{ api_domain }} {{ admin_api_domain }};
  root /var/www/public;
  index index.php;

  ssl_certificate /etc/nginx/ssl/cert.crt;
  ssl_certificate_key /etc/nginx/ssl/cert.key;

  client_max_body_size 32M;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # Hide nginx version
  server_tokens off;

  # Deny access to sensitive files that bots commonly check
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }

  location ~* \.(env|git|gitignore|gitattributes|lock)$ {
    deny all;
    access_log off;
    log_not_found off;
  }

  location ~* (composer\.(json|lock)|package\.(json|lock)|yarn\.lock|\.env.*|\.htaccess|\.htpasswd|web\.config)$ {
    deny all;
    access_log off;
    log_not_found off;
  }

  location ~* (readme|license|changelog|install|upgrade)(\.(txt|md|rst))?$ {
    deny all;
    access_log off;
    log_not_found off;
  }

  location ~* \.(sql|log|conf|ini|bak|backup|old|tmp|temp|swp|swo|~)$ {
    deny all;
    access_log off;
    log_not_found off;
  }

  # Deny access to common bot targets
  location ~* /(wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|wp-config\.php) {
    deny all;
    access_log off;
    log_not_found off;
  }

  location ~* /(administrator|phpmyadmin|pma|mysql|database) {
    deny all;
    access_log off;
    log_not_found off;
  }

  # Deny access to PHP files in uploads directory
  location ~* /uploads/.*\.php$ {
    deny all;
    access_log off;
    log_not_found off;
  }

  # Vite config (it will either use a proxy or be empty)
  include /etc/nginx/conf.d/vite-runtime.inc;

  # Handle static assets directly
  location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Proxy all other requests to PHP-FPM
  location / {
    fastcgi_keep_conn on;

    fastcgi_split_path_info ^(.+\.php)(/.*)$;
    include fastcgi_params;

    set $upstream_host "{{ php_cgi_pass }}";
    fastcgi_pass $upstream_host:9000;
    resolver 127.0.0.11 ipv6=off valid=5s;

    fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
    fastcgi_param DOCUMENT_ROOT /var/www/public;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param REQUEST_URI $request_uri;

    # Performance tuning
    fastcgi_buffer_size 128k;
    fastcgi_buffers 256 16k;
    fastcgi_busy_buffers_size 256k;
    fastcgi_temp_file_write_size 256k;
  }

  error_log  stderr warn;
  access_log  /dev/stdout main;
}
