server {
  listen 80 default_server;

  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  location = /health_check {
    access_log off;
    add_header 'Content-Type' 'application/json';
    return 200 '{"status":"OK"}';
  }

  location ~ /\. {
    deny all;
  }

  location / {
    deny all;
  }
}
