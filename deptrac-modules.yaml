parameters:
  paths:
    - ./src
  exclude_files:
    - '#.*\/src\/.*\/Infrastructure\/Adapter\/.*#'
  layers:
    -
      name: Shared
      collectors:
        -
          type: directory
          value: /src/Shared/.*
    -
      name: Catalog
      collectors:
        -
          type: directory
          value: /src/Catalog/.*
    -
      name: Customer
      collectors:
        -
          type: directory
          value: /src/Customer/.*
    -
      name: EmailSender
      collectors:
        -
          type: directory
          value: /src/EmailSender/.*
    -
      name: IdentityAccess
      collectors:
        -
          type: directory
          value: /src/IdentityAccess/.*
  ruleset:
    Catalog:
      - Shared
    Customer:
      - Shared
    EmailSender:
      - Shared
    IdentityAccess:
      - Shared
    Shared: ~
