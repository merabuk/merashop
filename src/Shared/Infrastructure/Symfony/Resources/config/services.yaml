      - { name: 'kernel.reset', method: 'reset' }

  App\Shared\Domain\Service\TranslationDomainResolverInterface: '@App\Shared\Infrastructure\Service\TranslationDomainResolver'

  App\Shared\Domain\Service\Identity\UlidGeneratorInterface: '@App\Shared\Infrastructure\Service\Identity\SymfonyUlidGenerator'
