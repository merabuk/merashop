  App\Shared\Domain\Service\Tracing\TraceIdFactoryInterface: '@App\Shared\Infrastructure\Service\Tracing\TraceIdFactory'
  App\Shared\Domain\Service\Tracing\TraceIdContextInterface: '@App\Shared\Infrastructure\Service\Tracing\TraceIdContext'

  App\Shared\Domain\Service\Validation\ImageValidatorInterface: '@App\Shared\Infrastructure\Service\Validation\ImageValidator'

  App\Shared\Domain\Service\Image\ImageConstraintsRegistryInterface: '@App\Shared\Infrastructure\Service\Image\ImageConstraintsRegistry'

  App\Shared\Presentation\Http\Resolver\CurrentAuthEntityIdentityResolver:
    tags: [ 'controller.argument_value_resolver' ]
