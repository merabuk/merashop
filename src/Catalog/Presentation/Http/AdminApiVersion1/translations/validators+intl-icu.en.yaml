admin:
  api:
    v1:
      attribute:
        type:
          invalid: "The selected attribute type is invalid. Allowed values are: {choices}"
        translations: &translations
          empty: "Translations array cannot be empty"
        locale: &locale
          missing: "Missing translations for the following locales: {locales}"
          invalid: "The selected locale is invalid"
      category:
        status:
          invalid: "The selected category status is invalid. Allowed values are: {choices}"
        translations:
          <<: *translations
        locale:
          <<: *locale
      product:
        prices:
          empty: "Prices array cannot be empty"
          duplicate: "Duplicate price found for currency '{key}'"
          type:
            invalid: "The selected price type is invalid. Allowed values are: {choices}"
          tax:
            value:
              invalid: "The selected tax value is invalid"
            type:
              invalid: "The selected tax type is invalid. Allowed values are: {choices}"
        status:
          invalid: "The selected product status is invalid. Allowed values are: {choices}"
        categories:
          empty: "Categories array cannot be empty"
        attribute_values:
          empty: "Attribute values array cannot be empty"
        images:
          empty: "Images array cannot be empty"
        translations:
          <<: *translations
        locale:
          <<: *locale
