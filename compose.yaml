services:
  pgsql:
    image: postgres:18-alpine3.21
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB}", "-U", "${POSTGRES_USER}"]
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      mode: global
      resources:
        limits:
          cpus: '0.5'
          memory: 500M
        reservations:
          cpus: '0.33'
          memory: 350M
    networks:
      - merashop-network
    ports:
      - ${FORWARD_DB_PORT}:5432
    volumes:
      - pgsql:/var/lib/postgresql/data

  pgsql-test:
    image: postgres:18-alpine3.21
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: [ "CMD", "pg_isready", "-d", "${POSTGRES_DB}", "-U", "${POSTGRES_USER}" ]
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      mode: global
      resources:
        limits:
          cpus: '0.5'
          memory: 500M
        reservations:
          cpus: '0.33'
          memory: 350M
    networks:
      - merashop-network
    ports:
      - ${FORWARD_TEST_DB_PORT}:5432
    volumes:
      - pgsql-test:/var/lib/postgresql/data

  nginx:
    image: merashop/nginx:latest
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        order: start-first
        failure_action: continue
      resources:
        limits:
          cpus: '0.25'
          memory: 125M
        reservations:
          cpus: '0.25'
          memory: 100M
    environment:
      APP_RUNTIME_ENV: ${APP_RUNTIME_ENV}
      PHP_CGI_PASS: ${PHP_CGI_PASS}
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost/health_check || exit 1" ]
      retries: 3
      timeout: 5s
    networks:
      - merashop-network
    ports:
      - ${APP_PORT:-80}:80
      - ${APP_SECURED_PORT:-443}:443
    volumes:
      - ./docker/nginx/etc/ssl:/etc/nginx/ssl
    depends_on:
      - app

  app:
    image: merashop/app:latest
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        order: start-first
        failure_action: continue
      resources:
        limits:
          cpus: '0.75'
          memory: 500M
        reservations:
          cpus: '0.5'
          memory: 350M
    environment:
      PHP_IDE_CONFIG: serverName=Docker
      STATIC_PHP_FPM_POOL_WORKERS: 5
      APP_RUNTIME_ENV: ${APP_RUNTIME_ENV}
      PHP_CGI_PASS: ${PHP_CGI_PASS}
    healthcheck:
      test: [ "CMD-SHELL", "./docker/app/shell/php-fpm-healthcheck.sh || exit 1" ]
      retries: 3
      timeout: 5s
    networks:
      - merashop-network
    ports:
      - '9000:9000'
    volumes:
      - ./:/var/www
      - ./docker/app/php/conf.d/zzz-settings-override-local.ini:/usr/local/etc/php/conf.d/zzz-settings-override.ini
    working_dir: /var/www

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    networks:
      - merashop-network
    ports:
      - ${RABBITMQ_FORWARD_PORT}:5672
      - ${RABBITMQ_DASHBOARD_FORWARD_PORT}:15672
    volumes:
      - rabbitmq:/var/lib/rabbitmq

networks:
  merashop-network:

volumes:
  pgsql:
    driver: local
  pgsql-test:
    driver: local
  rabbitmq:
    driver: local
