parameters:
  email_sender.max_attempts: '%env(int:EMAIL_OUTBOX_MAX_ATTEMPTS)%'
  email_sender.retry_strategy: 'quadratic'

services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\EmailSender\Domain\Service\OutboxRetryPolicy:
    arguments:
      $maxAttempts: '%email_sender.max_attempts%'

  App\EmailSender\Infrastructure\Service\OutboxEmailFactory:
    arguments:
      $defaultFrom: '%env(MAIL_FROM_ADDRESS)%'
      $defaultFromName: '%env(MAIL_FROM_NAME)%'
      $defaultMailDriver: "%env(MAIL_DRIVER)%"

  App\EmailSender\Application\EventHandler\AdminCreatedHandler:
    arguments:
      $appName: '%app.name%'
  App\EmailSender\Application\EventHandler\UserRegisteredHandler:
    arguments:
      $appName: '%app.name%'
  App\EmailSender\Application\Service\OutboxEmailRelayService:
    arguments:
      $subMinutes: 10
      $limit: 100

  App\EmailSender\Application\Service\EmailQueueServiceInterface: '@App\EmailSender\Application\Service\EmailQueueService'
  App\EmailSender\Application\Service\OutboxEmailRelayServiceInterface: '@App\EmailSender\Application\Service\OutboxEmailRelayService'

  App\EmailSender\Infrastructure\Mailer\MailerFactoryInterface: '@App\EmailSender\Infrastructure\Mailer\MailerFactory'

  App\EmailSender\Domain\Factory\Contracts\OutboxEmailFactoryInterface: '@App\EmailSender\Infrastructure\Service\OutboxEmailFactory'
  App\EmailSender\Domain\Service\MailerServiceInterface: '@App\EmailSender\Infrastructure\Service\MailerService'

  App\EmailSender\Domain\Repository\OutboxEmailReadRepositoryInterface: '@App\EmailSender\Infrastructure\Persistence\Doctrine\Repository\OutboxEmailReadRepository'
  App\EmailSender\Domain\Repository\OutboxEmailWriteRepositoryInterface: '@App\EmailSender\Infrastructure\Persistence\Doctrine\Repository\OutboxEmailWriteRepository'
