# Read the documentation: https://github.com/1up-lab/OneupFlysystemBundle
oneup_flysystem:
  adapters:
    catalog.adapter:
      local:
        location: '%kernel.project_dir%/var/storage/catalog'
  filesystems:
    catalog.filesystem:
      adapter: catalog.adapter

when@test:
  oneup_flysystem:
    adapters:
      catalog.adapter:
        memory: ~

