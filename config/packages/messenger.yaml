framework:
  messenger:
    failure_transport: failed

    transports:
      # https://symfony.com/doc/current/messenger.html#transport-configuration
      identity_access_outbox:
        dsn: 'doctrine://identity_access'
        options:
          table_name: 'identity_access_messages'
          queue_name: 'outbox'
          auto_setup: true
      identity_access_failed: 'doctrine://identity_access?queue_name=failed'
      async:
        dsn: '%env(DOCTRINE_MESSENGER_TRANSPORT_DSN)%'
        options:
          use_notify: true
          check_delayed_interval: 60000
        retry_strategy:
          max_retries: 3
          multiplier: 2
      amqp_events:
        dsn: '%env(AMQP_MESSENGER_TRANSPORT_DSN)%'
        options:
          auto_setup: true
          confirm_timeout: 5
          exchange:
            name: 'domain_events'
            type: 'topic'
          queues:
            email_sender_module:
              binding_keys:
                - !php/enum App\Shared\Domain\Event\SharedEventNameEnum::UserRegistered->value
      amqp_internal:
        dsn: '%env(AMQP_MESSENGER_TRANSPORT_DSN)%'
        options:
          exchange:
            name: 'internal_tasks'
            type: 'direct'
          queues:
            email_processor:
              binding_keys:
                - !php/enum App\EmailSender\Domain\Enum\EmailSenderQueueEnum::EmailProcessor->value
      # sync: 'sync://'

    default_bus: command.bus

    buses:
      command.bus:
        middleware:
          - doctrine_transaction
          - 'App\Shared\Infrastructure\Bus\TraceId\TraceIdMiddleware'
          - 'App\Shared\Infrastructure\Bus\Middleware\EventRoutingKeyMiddleware'
      query.bus:
      event.bus:
        middleware:
          - 'App\Shared\Infrastructure\Bus\TraceId\TraceIdMiddleware'
          - 'App\Shared\Infrastructure\Bus\Middleware\EventRoutingKeyMiddleware'
      messenger.bus.default: [ ]

    routing:
      Symfony\Component\Mailer\Messenger\SendEmailMessage: async
      Symfony\Component\Notifier\Message\ChatMessage: async
      Symfony\Component\Notifier\Message\SmsMessage: async

      # Route your messages to the transports
      App\Shared\Domain\Event\UserRegisteredSharedEvent: identity_access_outbox

      App\EmailSender\Application\Command\SendOutboxEmail\SendOutboxEmailCommand: amqp_internal
