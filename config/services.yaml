# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true      # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: '../src/'

  # add more service definitions when explicit configuration is needed
  # please note that last definitions always *replace* previous ones
  App\Shared\Domain\Service\UlidGeneratorInterface: 'App\Shared\Infrastructure\Service\SymfonyUlidGenerator'
  App\Shared\Domain\Service\UuidGeneratorInterface: 'App\Shared\Infrastructure\Service\SymfonyUuidGenerator'
  App\Shared\Domain\Service\TraceIdGeneratorInterface: 'App\Shared\Infrastructure\Service\TraceIdGenerator'
  App\Shared\Domain\Service\TraceIdServiceInterface: 'App\Shared\Infrastructure\Service\TraceIdContext'
  App\Users\Domain\Repository\UserReadRepositoryInterface: '@App\Users\Infrastructure\Persistence\Doctrine\Repository\UserReadRepository'
  App\Users\Domain\Repository\UserWriteRepositoryInterface: '@App\Users\Infrastructure\Persistence\Doctrine\Repository\UserWriteRepository'
  App\EmailSender\Domain\Repository\OutboxEmailReadRepositoryInterface: '@App\EmailSender\Infrastructure\Persistence\Doctrine\Repository\OutboxEmailReadRepository'
  App\EmailSender\Domain\Repository\OutboxEmailWriteRepositoryInterface: '@App\EmailSender\Infrastructure\Persistence\Doctrine\Repository\OutboxEmailWriteRepository'
