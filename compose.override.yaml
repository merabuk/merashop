x-queue-worker-defaults: &queue-worker-defaults-override
  platform: ${PLATFORM_ARCHITECTURE:-linux/amd64}
  pull_policy: never
  build:
    context: .
    target: ${APP_RUNTIME_ENV}
    dockerfile: ./docker/queue-worker/Dockerfile
    tags:
      - merashop/queue-worker:latest
  restart: on-failure

services:
  nginx:
    platform: ${PLATFORM_ARCHITECTURE:-linux/amd64}
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
      tags:
        - merashop/nginx:latest
    depends_on:
      - app

  app:
    platform: ${PLATFORM_ARCHITECTURE:-linux/amd64}
    build:
      context: .
      dockerfile: ./docker/app/Dockerfile
      target: ${APP_RUNTIME_ENV}
      tags:
        - merashop/app:latest
    depends_on:
      - pgsql
    restart: on-failure

  filebeat:
    platform: ${PLATFORM_ARCHITECTURE:-linux/amd64}
    build:
      context: ./docker/filebeat
      dockerfile: ./Dockerfile
      tags:
        - merashop/filebeat:latest

  identity-access-queue-worker:
    <<: *queue-worker-defaults-override

  customer-external-queue-worker:
    <<: *queue-worker-defaults-override

  email-sender-external-queue-worker:
    <<: *queue-worker-defaults-override

  email-sender-internal-queue-worker:
    <<: *queue-worker-defaults-override

  email-sender-sheduler-worker:
    <<: *queue-worker-defaults-override
